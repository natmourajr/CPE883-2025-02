[project]
version = "0.1.0"
name = "text_embeddings"
description = "Measure approaches on text embeddings from different models"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "accelerate>=1.10.1",
    "datasets>=4.0.0",
    "evaluate>=0.4.5",
    "h5py>=3.14.0",
    "hf-dataset-loader",
    "ipywidgets>=8.1.7",
    "jupyterlab-widgets>=3.0.15",
    "matplotlib>=3.10.6",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tabulate>=0.9.0",
    "tqdm[notebook]>=4.67.1",
    "transformers>=4.56.1",
    "typer>=0.16.0",
]

[project.scripts]
text-embeddings = "text_embeddings.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
hf-dataset-loader = { path = "../../dataloaders/hf_dataset_loader", editable = true }
