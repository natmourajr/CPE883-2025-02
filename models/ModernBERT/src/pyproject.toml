[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["algorithms", "bert_layers", "callbacks", "colbert_beir", "data", "evals"]

[tool.setuptools]
py-modules = ["bert_padding", "utils", "flex_bert", "hf_bert", "mosaic_bert", "scheduler", "sequence_packer", "text_data", "convert_dataset", "optimizer"]