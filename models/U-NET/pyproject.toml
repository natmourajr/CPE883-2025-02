[project]
name = "unet_model"
version = "0.1.0"
description = "Modelo U-NET para diffusion model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.1",
    "torch>=2.6.0",
    "sentencepiece>=0.2.0",
    "torchtext>=0.6.0",
    "matplotlib>=3.10",
    "PyQt6>=6.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
]
